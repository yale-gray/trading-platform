name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"  # nightly, UTC
permissions:
  contents: read
jobs:
  lint-test:
    # PR and push: fast suite plus the cheap golden change-note check.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not slow and not golden"
      - run: uv run pytest tests/golden/test_golden_change_note.py
  slow-golden:
    # Push to main and nightly: slow tests and the pinned golden backtests.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "slow or golden"
