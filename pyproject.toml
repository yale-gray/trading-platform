[project]
name = "tradebot"
version = "0.1.0"
description = "Paper-trading bot and platform (simulated money only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "yfinance>=0.2.40",
    "ccxt>=4.3",
    "exchange-calendars>=4.5,<5",
    "pyyaml>=6.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlmodel>=0.0.22",
    "tzdata>=2024.1",
]

[project.scripts]
tradebot = "tradebot.cli:main"

[dependency-groups]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
runner = ["apscheduler>=3.10,<4"]
dashboard = ["streamlit>=1.36", "plotly>=5.22", "httpx>=0.27"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev", "api", "runner", "dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=20 --ignore=tests/manual"
markers = [
    "unit: fast isolated tests",
    "property: hypothesis property tests",
    "integration: multi-module tests",
    "golden: pinned-result tests (changes need a PM-approved note)",
    "restart: runner crash/restart and idempotency tests",
    "slow: tests over 2 seconds (run in the main/nightly CI job, not on PRs)",
]
filterwarnings = [
    "error",
    # exchange-calendars 4.13 on numpy 2.x; remove when exchange-calendars is upgraded
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["tradebot"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Spec markdown code blocks are not project source; Ruff 0.17 formats them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tradebot"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
