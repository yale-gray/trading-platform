schema_version: 1
id: index_equity_mom
name: Equity-only index momentum (no bond or gold tilt)
kind: rotation
asset_class: equity
parameters: {mom_lookback: 126, trend_len: 200, top_n: 2}
universe: [SPY, QQQ, IWM, EFA, EEM]
schedule: {freq: monthly}
eligibility:
  gt: [{price: close}, {ind: sma, period: $trend_len}]
filter_mode: pre_rank
rank: {by: {ind: ret, period: $mom_lookback}, order: desc}
select: {top: $top_n, weighting: equal}
fallback: {symbol: IEF}
# Run with override "vol_scaled": false.
