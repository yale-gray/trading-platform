schema_version: 1
id: stocks_dt_dip
name: S&P 500 15-minute dip buyer (day trade)
description: >-
  Buy a stock that has dropped sharply below its own 15-minute average while its short trend is
  still up; sell when it snaps back to the average, on an ATR trailing stop, or at the close.
kind: rules
asset_class: equity
timeframe: 15m
# UNIVERSE = CURRENT S&P 500 CONSTITUENTS (SURVIVORSHIP-BIASED, ADR A13); same list as
# stocks_momentum_cash (snapshot in src/tradebot/data/universes/sp500.csv).
# PRE-REGISTERED (ADR-0001 A21, 2026-10-23): every number below is a round, conventional value
# fixed BEFORE looking at any data. Do not tune on results; a different value is a new strategy id.
# Needs an account with intraday_flatten (the end-of-day exit) and settlement t1 (the daytrading
# preset): run on its own it would hold overnight.
# Entry (all of): close above its {trend_bars}-bar SMA (about 5 sessions: trend filter); not in the
# first {min_bar} bars of the session (open noise); and EITHER the close is at least |dip_z| ATRs
# below its {avg_bars}-bar average (dip) OR RSI(rsi_bars) < rsi_max (short-term oversold).
# Exit: close back at/above the {avg_bars}-bar average (reversion), OR the 2xATR(14) trailing stop,
# OR the end-of-session flatten of the account. At most max_pos positions, equal weight 1/max_pos
# of the sleeve; free slots go to the most oversold (lowest ATR distance) candidates.
parameters:
  avg_bars: 20
  dip_z: -2.0
  rsi_bars: 2
  rsi_max: 10
  trend_bars: 130
  min_bar: 2
  stop_atr: 2.0
  max_pos: 5
schedule: {freq: bar}
entry:
  all:
    - gt: [{price: close}, {ind: sma, period: $trend_bars}]
    - ge: [{session: bar_index}, $min_bar]
    - any:
        - lt: [{ind: devatr, period: $avg_bars}, $dip_z]
        - lt: [{ind: rsi, period: $rsi_bars}, $rsi_max]
exit:
  ge: [{price: close}, {ind: sma, period: $avg_bars}]
position:
  weight: equal
  max_positions: $max_pos
  rank: {by: {ind: devatr, period: $avg_bars}, order: asc}
stops:
  - {type: atr_trailing, period: 14, mult: $stop_atr, anchor: highest_close_since_entry}
