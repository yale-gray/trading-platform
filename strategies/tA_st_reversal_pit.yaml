schema_version: 1
id: tA_st_reversal_pit
name: S&P 500 short-term reversal, point-in-time universe (trial 11)
description: >-
  Every day, hold the 10 stocks with the worst 5-day return among those that were S&P 500 members the day before; sell each after 4 days held.
kind: rules
asset_class: equity
# TRIAL 11 (of 12), PRE-REGISTERED before any backtest of this id (ADR-0001 A32). Parameters are FROZEN
# from tA_st_reversal (lookback 5, hold_bars 4, max_pos 10, same rank and exit); only the universe changed.
# Do not tune on results; a changed number is a new strategy id. Development data 2016-2023 only; 2024+ is
# the sealed hold-out (ADR A25). Basis: Lehmann 1990; Lo & MacKinlay 1990; Nagel 2012 (long leg only, no shorting).
# UNIVERSE = every ticker that was an S&P 500 member at any time 2015-06-01..2023-12-31 and has price data
# (src/tradebot/data/universes/sp500_history.csv, point-in-time). Entry is gated by {universe: sp500_member}
# (membership at the previous close, causal); membership gates entries only, a held name that leaves the index
# is sold by its normal exit. Residual survivorship bias is documented in
# docs/research/sp500-pit-coverage-2026-10.md; prices for removed names come from Alpaca SIP (2016-01 onward).
# Run this strategy from the cache only (refresh=False): removed names have no yfinance feed to refresh from.
# Daily bars: decide at the close, fill at the next open. bars_held >= 4 = exit after 5 sessions.
parameters: {lookback: 5, hold_bars: 4, max_pos: 10}
schedule: {freq: daily}
entry:
  eq: [{universe: sp500_member}, 1]
exit:
  ge: [{pos: bars_held}, $hold_bars]
position:
  weight: equal
  max_positions: $max_pos
  rank: {by: {ind: ret, period: $lookback}, order: asc}
